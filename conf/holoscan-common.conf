# Enable OpenGL and Vulkan (required for Holoscan SDK)
DISTRO_FEATURES:append = " opengl vulkan"

# Use systemd as system init manager (for e.g. nvfancontrol service)
INIT_MANAGER = "systemd"

# GStreamer Preferred Providers
PREFERRED_RPROVIDER_libgstallocators-1.0 = "gstreamer1.0-plugins-base"
PREFERRED_RPROVIDER_libgstapp-1.0 = "gstreamer1.0-plugins-base"
PREFERRED_RPROVIDER_libgstaudio-1.0 = "gstreamer1.0-plugins-base"
PREFERRED_RPROVIDER_libgstgl-1.0 = "gstreamer1.0-plugins-base"
PREFERRED_RPROVIDER_libgstpbutils-1.0 = "gstreamer1.0-plugins-base"
PREFERRED_RPROVIDER_libgstphotography-1.0 = "gstreamer1.0-plugins-bad"
PREFERRED_RPROVIDER_libgstvideo-1.0 = "gstreamer1.0-plugins-base"

# Install Mellanox OFED
CORE_IMAGE_EXTRA_INSTALL:append = " mlnx-ofed"

# Default to MAXN power mode
NVPMODEL_CONFIG_DEFAULT = "0"

# Preferred version of abseil-cpp
PREFERRED_VERSION_abseil-cpp = "20250814.0"

# Preferred version of cli11
# meta-openembedded scarthgap only ships 2.3.2; meta-tegra-holoscan
# carries a 2.5.0 recipe (recipes-support/cli11/cli11_2.5.0.bb) because
# Holoscan SDK 4.2.0's 0002-Use-external-dependencies-deps.patch raises
# the CLI11 floor to 2.5.0 to match SDK 4.2.0's CLI11_VERSION 2.5.0.
PREFERRED_VERSION_cli11 = "2.5.0"

# Preferred version of libeigen
# meta-openembedded scarthgap only ships 3.4.0; meta-tegra-holoscan
# carries a 3.4.1 recipe (recipes-support/libeigen/libeigen_3.4.1.bb)
# because ORT 1.24.2 source uses the templated 'min<Eigen::PropagateNaN>'
# / 'max<Eigen::PropagateNaN>' overloads added in
# Eigen/src/plugins/ArrayCwiseBinaryOps.h between 3.4.0 and 3.4.1.
PREFERRED_VERSION_libeigen = "3.4.1"

# CUDA CCCL Preferred Providers
PREFERRED_PROVIDER_cuda-cccl = "cccl"
PREFERRED_RPROVIDER_cuda-cccl = "cccl"

# Preferred version of fmt
PREFERRED_VERSION_fmt = "12.1.0"

# Preferred version of spdlog
PREFERRED_VERSION_spdlog = "1.17.0"

# crates.io's API endpoint at `https://crates.io/api/v1/crates/<name>/<version>/download`
# returns HTTP 403 to default-UA clients (bitbake's wget, curl, etc.) globally
# as of May 2026 -- crates.io tightened User-Agent enforcement on the API
# endpoint, so a clean `do_fetch` for any cargo-based recipe (notably
# `librsvg` / `librsvg-native` pulled in by meta-openembedded) fails on
# every builder regardless of region. Bypass the API by pointing bitbake's
# `crates://` fetcher (which internally rewrites to the API URL) directly
# at static.crates.io (Fastly CDN). That host serves the same `.crate`
# tarballs with byte-identical SHA-256 and does not enforce a UA policy,
# so bitbake's integrity check still passes.
#
# Use MIRRORS, NOT PREMIRRORS. `meta/classes-global/uninative.bbclass`
# enumerates every PREMIRRORS rule at BuildStarted and synthesizes a new
# PREMIRRORS entry per `http*` rule using our `replace` field as a literal
# URL suffix (lines 67-75). Because our replace contains `\1`/`\2`
# backrefs, the synthesized rule has a literal-URL pattern (zero capture
# groups) but a replacement template referencing group 1, so
# `re.sub` blows up at config-parse time with
# `re.error: invalid group reference 1 at position 9`,
# bricking the build before `do_fetch` even runs. MIRRORS is not walked
# by uninative.bbclass, so this rule is safe there.
#
# Trade-off: MIRRORS is consulted only after the upstream URL fails, so
# every clean fetch costs one extra crates.io 403 round-trip per crate
# before falling through to static.crates.io. Acceptable given how rarely
# cargo recipes are re-fetched from scratch.
#
# Backreferences are single-backslash (`\1`, `\2`); bitbake's mirror
# regex engine treats the source URL pattern as a Python `re` expression
# and the destination is `re.sub`'d in.
MIRRORS:append = " \
    https://crates.io/api/v1/crates/(.*)/(.*)/download https://static.crates.io/crates/\1/\1-\2.crate \n \
"
